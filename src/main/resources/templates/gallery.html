<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title th:text="#{nav.gallery}">Фотоальбом</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <link th:href="@{/css/style.css}" rel="stylesheet"/>
    <link th:href="@{/css/gallery.css}" rel="stylesheet"/>

    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
</head>

<body th:data-username="${#authentication.name}"
      th:data-is-admin="${#authorization.expression('hasRole(''ADMIN'')')}">

<!-- header включаем внутри body -->
<div th:replace="~{fragments/header :: header}"></div>

<!-- Верхнее меню действий -->
<div id="galleryActions" class="d-flex justify-content-center gap-2 mb-3 align-items-center">

    <!-- Показать/скрыть теги -->
    <button id="toggleTagsBtn"
            class="btn btn-sm btn-outline-secondary"
            data-bs-toggle="tooltip"
            data-bs-title="Показать/скрыть теги">
        <i class="bi bi-eye"></i>
    </button>

    <!-- Режим отметки -->
    <button id="editTagsBtn"
            class="btn btn-sm btn-outline-warning"
            data-bs-toggle="tooltip"
            data-bs-title="Отметить человека">
        <i class="bi bi-person-plus"></i>
    </button>

    <!-- Все фото (таблица/галерея) -->
    <a href="/gallery/grid"
       class="btn btn-sm btn-outline-primary"
       data-bs-toggle="tooltip"
       data-bs-title="Все фото / таблица">
        <i class="bi bi-grid-3x3-gap"></i>
    </a>

</div>

<main class="gallery-fullscreen">

    <button class="nav-btn left" onclick="showPrevious()" aria-label="Предыдущая фотография"><i class="bi bi-chevron-left"></i></button>

    <!-- Обёртка, которой JS будет управлять по высоте -->
    <div id="photoWrapper">
        <div id="photoCanvas" class="photo-canvas">
            <img id="mainPhoto" class="main-photo" src="" alt="Фото"/>
        </div>
    </div>

    <button class="nav-btn right" onclick="showNext()" aria-label="Следующая фотография"><i class="bi bi-chevron-right"></i></button>

</main>

<div th:if="${#authorization.expression('hasRole(''ADMIN'')')}"
     th:replace="~{fragments/relative_tag_modal :: tagModal}">
</div>

<script th:inline="javascript">
    window.galleryData = {
      galleryOwner: [[${galleryOwner}]],
      photos: [[${photos}]],
      noPhotosMsg: [[#{gallery.noPhotos}]],
      isAdmin: [[${#authorization.expression('hasRole(''ADMIN'')')}]]
    };
</script>

<!-- Подключаем основной скрипт первым -->
<script th:src="@{/js/gallery.js}"></script>
<!-- затем скрипт по тегам -->
<script th:src="@{/js/gallery_tags.js}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
